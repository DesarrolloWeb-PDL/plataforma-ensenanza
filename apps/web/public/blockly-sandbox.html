<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Sandbox de bloques</title>
  <style>
    body { margin: 0; font-family: "Arial Black", Arial, sans-serif; background: #fef3c7; }
    #stage {
      position: relative;
      height: 240px;
      overflow: hidden;
      background: linear-gradient(#bae6fd 0 64%, #86efac 64% 100%);
      border-bottom: 3px solid #000;
    }
    #sprite {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 130px;
      height: 92px;
      transform: translate(-50%, -50%);
      transition: transform 0.3s ease-out;
      will-change: transform;
    }
    #blocklyDiv { height: 420px; width: 100%; border: 3px solid #000; box-sizing: border-box; }
    .bar { display: flex; gap: 0.6rem; padding: 0.8rem; background: #facc15; border-bottom: 3px solid #000; }
    button { font-family: inherit; font-weight: 900; text-transform: uppercase; border: 3px solid #000; background: #fff; padding: 0.5rem 1rem; box-shadow: 4px 4px 0 #000; cursor: pointer; }
    button:hover { transform: translate(2px,2px); box-shadow: 2px 2px 0 #000; }
    #output { padding: 0.8rem; font-weight: 700; }
  </style>
</head>
<body>
  <div class="bar">
    <button onclick="runCode()">Ejecutar</button>
    <button onclick="resetWorkspace()">Limpiar</button>
  </div>
  <div id="stage">
    <div id="sprite">
      <svg viewBox="0 0 148 104" width="130" height="92" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carpincho">
        <g stroke="#000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
          <rect x="26" y="68" width="18" height="26" rx="7" fill="#7a4f26" />
          <rect x="84" y="68" width="18" height="26" rx="7" fill="#7a4f26" />
          <rect x="12" y="36" width="100" height="46" rx="23" fill="#9c6b3f" />
          <rect x="94" y="12" width="46" height="50" rx="20" fill="#9c6b3f" />
          <circle cx="106" cy="14" r="9" fill="#7a4f26" />
          <circle cx="130" cy="16" r="8" fill="#7a4f26" />
          <rect x="126" y="32" width="18" height="24" rx="9" fill="#b58556" />
          <ellipse cx="139" cy="40" rx="4.5" ry="3.5" fill="#3b2412" stroke-width="3" />
          <circle cx="116" cy="30" r="5" fill="#000" stroke="none" />
          <path d="M132 51 q5 4 10 0" fill="none" stroke-width="3" />
        </g>
      </svg>
    </div>
  </div>
  <div id="blocklyDiv"></div>
  <div id="output">Presioná Ejecutar para ver el resultado.</div>

  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script>
    // --- Estado del carpincho en el escenario ---
    const stage = document.getElementById('stage');
    const sprite = document.getElementById('sprite');
    const STEP_PX = 4;      // 1 paso = 4 px de escenario
    const MOVE_MS = 300;    // duración del movimiento
    const TURN_MS = 250;    // duración del giro

    let spriteX = 0;        // desplazamiento desde el centro del escenario
    let spriteY = 0;
    let spriteAngle = 0;    // 0° = mirando a la derecha, positivo = horario (como Scratch)

    function applySpriteTransform() {
      const maxX = Math.max(0, stage.clientWidth / 2 - sprite.offsetWidth / 2);
      const maxY = Math.max(0, stage.clientHeight / 2 - sprite.offsetHeight / 2);
      spriteX = Math.max(-maxX, Math.min(maxX, spriteX));
      spriteY = Math.max(-maxY, Math.min(maxY, spriteY));
      sprite.style.transform =
        'translate(-50%, -50%) translate(' + spriteX + 'px, ' + spriteY + 'px) rotate(' + spriteAngle + 'deg)';
    }

    function resetSprite() {
      spriteX = 0;
      spriteY = 0;
      spriteAngle = 0;
      applySpriteTransform();
    }

    // --- Cola de acciones: cada bloque encola su animación y se ejecuta en orden ---
    let actionQueue = [];
    let queueRunning = false;

    function waitMs(ms) {
      return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    function enqueueAction(action) {
      actionQueue.push(action);
    }

    function startQueue() {
      if (queueRunning) return;
      queueRunning = true;
      processQueue().finally(function () { queueRunning = false; });
    }

    async function processQueue() {
      while (actionQueue.length > 0) {
        const action = actionQueue.shift();
        await action();
      }
    }

    function moveSteps(steps) {
      enqueueAction(function () {
        const rad = (spriteAngle * Math.PI) / 180;
        spriteX += Math.cos(rad) * steps * STEP_PX;
        spriteY += Math.sin(rad) * steps * STEP_PX;
        applySpriteTransform();
        return waitMs(MOVE_MS);
      });
    }

    function turnDegrees(degrees) {
      enqueueAction(function () {
        spriteAngle += degrees;
        applySpriteTransform();
        return waitMs(TURN_MS);
      });
    }

    // --- Bloques de movimiento ---
    Blockly.Blocks['motion_move'] = {
      init: function () {
        this.appendDummyInput()
          .appendField('mover')
          .appendField(new Blockly.FieldNumber(10, -9999, 9999), 'STEPS')
          .appendField('pasos');
        this.setPreviousStatement(true);
        this.setNextStatement(true);
        this.setColour('#4C97FF');
        this.setTooltip('Mover el carpincho en la dirección en la que mira.');
        this.setHelpUrl('');
      }
    };

    Blockly.Blocks['motion_turn'] = {
      init: function () {
        this.appendDummyInput()
          .appendField('girar')
          .appendField(new Blockly.FieldNumber(15, -360, 360), 'DEGREES')
          .appendField('grados');
        this.setPreviousStatement(true);
        this.setNextStatement(true);
        this.setColour('#4C97FF');
        this.setTooltip('Girar el carpincho. Número positivo gira a la derecha (horario).');
        this.setHelpUrl('');
      }
    };

    // Generación de JavaScript: los bloques llaman al runtime del escenario.
    const motionGenerators = {
      motion_move: function (block) {
        return 'moveSteps(' + Number(block.getFieldValue('STEPS')) + ');\n';
      },
      motion_turn: function (block) {
        return 'turnDegrees(' + Number(block.getFieldValue('DEGREES')) + ');\n';
      }
    };
    Object.keys(motionGenerators).forEach(function (type) {
      if (Blockly.JavaScript.forBlock) {
        Blockly.JavaScript.forBlock[type] = motionGenerators[type];
      }
      Blockly.JavaScript[type] = motionGenerators[type];
    });

    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: `<xml>
        <category name="Movimiento" colour="#4C97FF">
          <block type="motion_move"></block>
          <block type="motion_turn"></block>
        </category>
        <category name="Control" colour="#5b80a5">
          <block type="controls_if"></block>
          <block type="controls_repeat_ext"></block>
          <block type="controls_whileUntil"></block>
          <block type="controls_for"></block>
        </category>
        <category name="Lógica" colour="#5b67a5">
          <block type="logic_compare"></block>
          <block type="logic_operation"></block>
          <block type="logic_negate"></block>
          <block type="logic_boolean"></block>
        </category>
        <category name="Matemática" colour="#5b9aa5">
          <block type="math_number"></block>
          <block type="math_arithmetic"></block>
          <block type="math_single"></block>
          <block type="math_round"></block>
          <block type="math_modulo"></block>
          <block type="math_random_int"></block>
        </category>
        <category name="Texto" colour="#5ba58c">
          <block type="text"></block>
          <block type="text_join"></block>
          <block type="text_length"></block>
          <block type="text_print"></block>
        </category>
        <category name="Variables" colour="#a55b80">
          <block type="variables_set"></block>
          <block type="variables_get"></block>
        </category>
        <category name="Listas" colour="#a58c5b">
          <block type="lists_create_with"></block>
          <block type="lists_length"></block>
          <block type="lists_getIndex"></block>
        </category>
      </xml>`
    });

    function runCode() {
      const code = Blockly.JavaScript.workspaceToCode(workspace);
      const out = document.getElementById('output');
      try {
        actionQueue = [];
        // eslint-disable-next-line no-eval
        const result = eval(code);
        if (actionQueue.length > 0) {
          out.textContent = 'Ejecutando…';
          startQueue();
          const watchQueue = setInterval(function () {
            if (actionQueue.length === 0 && !queueRunning) {
              clearInterval(watchQueue);
              out.textContent = 'Listo. El carpincho terminó su recorrido.';
            }
          }, 100);
        } else {
          out.textContent = 'Resultado: ' + (result === undefined ? '(sin salida)' : result);
        }
      } catch (e) {
        out.textContent = 'Error: ' + e.message;
      }
    }

    function resetWorkspace() {
      workspace.clear();
      actionQueue = [];
      resetSprite();
      document.getElementById('output').textContent = 'Workspace limpio. El carpincho volvió al centro.';
    }

    resetSprite();
  </script>
</body>
</html>
