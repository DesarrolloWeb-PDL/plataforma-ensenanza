name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@12.16.1 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @plataforma/shared test -- --coverage
      - run: pnpm --filter @plataforma/db test -- --coverage
      - run: pnpm --filter @plataforma/storage test -- --coverage
      - run: pnpm --filter @plataforma/api test -- --coverage
      - run: pnpm --filter @plataforma/web build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm --filter @plataforma/web test:e2e